name: Build And Release

on:
  push:
    branches:
      - release
      - prerelease
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codelogic-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Compose version
        id: version
        shell: pwsh
        run: |
          # ── Composed version: {major.minor from version.txt}.{run_number}[+sha] ──
          # Major.Minor is hand-controlled in version.txt. The GitHub run number is
          # the monotonic patch component. The git sha is SemVer build-metadata:
          # nuget.org strips it from the package version, so it is provenance only —
          # it survives in the assembly InformationalVersion. Nothing is written back
          # to the repo; the version is composed at pack time via -p:Version.
          $rootVer = (Get-Content 'version.txt' -TotalCount 1).Trim()   # e.g. "4.8"
          $sha = '${{ github.sha }}'.Substring(0,7)
          if ('${{ github.ref_name }}' -eq 'prerelease') {
            $version = "$rootVer.${{ github.run_number }}-preview+$sha"
          } else {
            $version = "$rootVer.${{ github.run_number }}+$sha"
          }
          # Tag/asset-safe form: no +metadata (illegal-ish in filenames, noisy in tags).
          $tagVersion = $version.Split('+')[0]
          Write-Host "Composed version for this run: $version (tag: v$tagVersion)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_version=$tagVersion" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore src/CodeLogic.csproj

      - name: Build
        run: |
          dotnet build src/CodeLogic.csproj --configuration Release --no-restore \
            /p:Version=${{ steps.version.outputs.version }} \
            /p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Pack
        run: |
          dotnet pack src/CodeLogic.csproj --configuration Release --no-build --output artifacts \
            /p:PackageVersion=${{ steps.version.outputs.version }} \
            /p:Version=${{ steps.version.outputs.version }} \
            /p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Push to NuGet.org
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $runtimeZip = "artifacts/CodeLogic-${{ steps.version.outputs.tag_version }}.zip"
          Compress-Archive -Path 'src/bin/Release/net10.0/*' -DestinationPath $runtimeZip -Force

          @"
          ## CodeLogic ${{ steps.version.outputs.version }}

          **Commit**: ${{ github.sha }}
          "@ | Set-Content 'artifacts/release-notes.md'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.tag_version }}
          name: CodeLogic ${{ steps.version.outputs.tag_version }}
          body_path: artifacts/release-notes.md
          prerelease: ${{ github.ref_name == 'prerelease' }}
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.zip

      # NOTE: this workflow no longer writes versions back to the repo.
      # The major.minor line lives in version.txt (hand-controlled); the patch
      # is the CI run number, composed at pack time. Push main → prerelease for
      # a preview package, main → release to publish.
